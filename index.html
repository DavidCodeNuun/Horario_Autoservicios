<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Horarios BUAP</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="navbar">

        <div class="logo-container">
            <img src="assets/Imagenes/logo-buap.png"
                class="logo"
                alt="Logo BUAP"
                title="Logo de la BUAP">

            <div class="logo-text">
                <p>Benemérita Universidad Autónoma de Puebla</p>
            </div>
        </div>

        <div class="usuario">
            <span>Estudiante</span>
        </div>

    </header>

    <main>
        <div class="heading">
            <h1>Generador de horarios</h1>
            <p>Selecciona tus materias y sus horarios para generar todas las combinaciones posibles.</p>
        </div>
    
        <section class="panels">
            <article class="card">
                <h2>📖　Proyeccion de Materias <b id="count"></b></h2>
                <input id="search" placeholder="⌕　Buscar materia...">
                <div id="subjects" class="scroll"></div>
            </article>
    
            <article class="card">
                <h2>◷　Cursos <b id="selected"></b></h2>
    
                <!-- FILTROS -->
                <section class="courses-filters">
    
                    <div class="filter-group">
                        <label>Desde</label>
    
                        <select id="horaInicio">
                            <option value="">Todas</option>
                            <option value="07:00">07:00</option>
                            <option value="08:00">08:00</option>
                            <option value="09:00">09:00</option>
                            <option value="10:00">10:00</option>
                            <option value="11:00">11:00</option>
                            <option value="12:00">12:00</option>
                            <option value="13:00">13:00</option>
                            <option value="14:00">14:00</option>
                            <option value="15:00">15:00</option>
                            <option value="16:00">16:00</option>
                            <option value="17:00">17:00</option>
                            <option value="18:00">18:00</option>
                            <option value="19:00">19:00</option>
                            <option value="20:00">20:00</option>
                            <option value="21:00">21:00</option>
                        </select>
                    </div>
    
                    <div class="filter-group">
                        <label>Hasta</label>
    
                        <select id="horaFin">
                            <option value="">Todas</option>
                            <option value="07:00">07:00</option>
                            <option value="08:00">08:00</option>
                            <option value="09:00">09:00</option>
                            <option value="10:00">10:00</option>
                            <option value="11:00">11:00</option>
                            <option value="12:00">12:00</option>
                            <option value="13:00">13:00</option>
                            <option value="14:00">14:00</option>
                            <option value="15:00">15:00</option>
                            <option value="16:00">16:00</option>
                            <option value="17:00">17:00</option>
                            <option value="18:00">18:00</option>
                            <option value="19:00">19:00</option>
                            <option value="20:00">20:00</option>
                            <option value="21:00">21:00</option>
                        </select>
                    </div>
    
                    <div class="filter-group">
                        <label>Aulas (opcional)</label>
    
                        <select id="filtroAula">
                            <option value="">Todas</option>
                        </select>
                    </div>
    
                    <div class="filter-actions">
                        <button id="clearFilters">
                            Limpiar filtros
                        </button>
                    </div>
    
                </section>
                <div id="sections" class="scroll"></div>
            </article>

        </section>

        <!-- HORARIO SEMANAL -->
        <section class="schedule-section">
        
            <article class="card schedule-card">
        
                <h2>
                    📅 Horario Semanal
                </h2>
        
                <div id="schedule">
        
                    <p class="schedule-placeholder">
                        Selecciona cursos para generar el horario.
                    </p>
        
                </div>
        
            </article>
        
        </section>
    </main>
    <script src="js/app.js"></script>
    
</body>

</html>
