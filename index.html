<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Generador de Horarios BUAP</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            BUAP
        </div>

        <div class="titulo-navbar">
            Benemérita Universidad Autónoma de Puebla
        </div>

    </header>

    <main>

        <section class="encabezado">

            <h1>Generador de Horarios</h1>

            <p>
                Selecciona tus materias y consulta los horarios
                disponibles.
            </p>

        </section>

        <section class="contenedor">

            <div class="card">

                <div class="card-header">
                    <h2>Despliegue de Materias</h2>
                </div>

                <input
                    type="text"
                    id="busqueda"
                    placeholder="Buscar materia..."
                >

                <div id="listaMaterias">

                </div>

            </div>

            <div class="card">

                <div class="card-header">

                    <h2>
                        Información de Materia
                    </h2>

                </div>

                <div id="detalleMateria">

                    Selecciona una materia.

                </div>

            </div>

        </section>

        <section class="seleccionadas-card">

            <h2>Materias Seleccionadas</h2>

            <div id="listaSeleccionadas">

            </div>

        </section>

    </main>

    <script src="js/materias.js"></script>
    <script src="js/seleccion.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
